name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests (standard library only)
        run: python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Install the wheel and verify entry points and bundled skill
        run: |
          python -m pip install dist/*.whl
          agentbridge --version
          agentbridge-install --help
          python - <<'PY'
          from agentbridge.skill_install import SOURCE
          for name in ("SKILL.md", "agents/openai.yaml", "scripts/handoff.py"):
              assert (SOURCE / name).is_file(), name
          print("bundled skill templates OK:", SOURCE)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
